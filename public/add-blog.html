<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <nav>
        <h2>Blog Manager</h2>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="add-blog.html">Add Blog</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="hero">
        <h1>Add New Blog</h1>
        <p>Create your blog by filling the form below.</p>
    </section>

    <form id="blogForm">

        <label>Blog Title</label>
        <input
            type="text"
            id="title"
            placeholder="Enter Blog Title"
        >

        <label>Author Name</label>
        <input
            type="text"
            id="author"
            placeholder="Enter Author Name"
        >

        <label>Blog Content</label>
        <textarea
            id="content"
            placeholder="Write your blog here..."
        ></textarea>

        <button type="submit">
            Add Blog
        </button>

    </form>

    <p id="message"></p>

</main>

<footer>
    <p>&copy; 2026 Blog Manager | Full Stack Internship Project</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
